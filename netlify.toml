# Netlify serves the built site from dist/ and runs the API as a function.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# One official address: the Netlify address sends everything to the real domain.
[[redirects]]
  from = "https://parijatak.netlify.app/*"
  to = "https://www.studioparijatak.com/:splat"
  status = 301
  force = true

# The API (server/) runs inside the "api" function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# The page files themselves are not separate addresses: send them to the clean address.
# (These match only what the visitor asked for, so the rewrites below do not loop.)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/collection.html"
  to = "/collection"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

# Each public page has its own HTML file with its title, description and official address
# (written by the build), so search engines and link previews see them without JavaScript.
[[redirects]]
  from = "/collection"
  to = "/collection.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# The admin area is part of the same React app.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Any other address is answered "not found" (status 404); the app still shows its page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Basic protections for every page (the API adds its own, stricter set).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Built files have a fingerprint in their name, so a new release always gets new names.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Keep the admin area out of search results.
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
